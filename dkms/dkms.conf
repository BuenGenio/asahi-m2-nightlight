PACKAGE_NAME="appledrm-nightlight"
PACKAGE_VERSION="1.0"

# The patched module is the whole in-tree appledrm driver, whose source changes
# between kernel versions. PRE_BUILD fetches the apple-dcp source matching the
# *target* kernel and applies nightlight.patch into ./src, so a kernel upgrade
# rebuilds against the correct source automatically. Requires network at build
# time (i.e. during `apt upgrade`).
PRE_BUILD="pre-build.sh ${kernelver}"

MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build/src modules"
CLEAN="rm -rf ${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build/src ${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build/.linux"

BUILT_MODULE_NAME[0]="appledrm"
BUILT_MODULE_LOCATION[0]="src"
# Installs to /lib/modules/$kver/updates/dkms/, which depmod prefers over the
# in-tree kernel/drivers/gpu/drm/apple/appledrm.ko.zst -- so it shadows the
# stock module without overwriting it. `dkms remove` reverts cleanly.
DEST_MODULE_LOCATION[0]="/updates/dkms"

AUTOINSTALL="yes"
